openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: smart-pantry
    description: SmartPantry demo operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /smart-pantry/test-alert:
    post:
      operationId: triggerPantryTestAlert
      tags: [smart-pantry]
      summary: Generate a simulated SmartPantry SMS alert
      description: Returns an on-screen demo message without sending an SMS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PantryTestAlertInput"
      responses:
        "200":
          description: Simulated SMS alert message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryTestAlert"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PantryTestAlertInput:
      type: object
      properties:
        phoneNumber:
          type: string
          minLength: 1
    PantryTestAlert:
      type: object
      properties:
        message:
          type: string
        deliveryMode:
          type: string
          enum: [simulated]
      required:
        - message
        - deliveryMode
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

